name: Validar e empacotar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main, work, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes
        run: python -m pytest -q

  windows:
    name: Aplicativo Windows x64
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-dev.txt
      - name: Criar aplicativo onedir
        run: pyinstaller --noconfirm --clean ReceitaLocal.spec
      - name: Adicionar documentação e versão
        shell: pwsh
        run: |
          Copy-Item docs/GUIA_WINDOWS.md dist/ReceitaLocal/LEIA-ME.txt
          "0.1.0+$env:GITHUB_SHA" | Set-Content dist/ReceitaLocal/VERSAO.txt
      - name: Smoke test do executável e URL local
        shell: pwsh
        run: |
          $env:RECEITA_NO_BROWSER = "1"
          $env:RECEITA_FIXED_PORT = "8501"
          $process = Start-Process -FilePath "dist/ReceitaLocal/ReceitaLocal.exe" -PassThru
          try {
            $ready = $false
            1..90 | ForEach-Object {
              if (-not $ready) {
                try {
                  $response = Invoke-WebRequest "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 1
                  if ($response.StatusCode -eq 200) { $ready = $true }
                } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ready) { throw "A URL local não ficou disponível" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process ReceitaLocal -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Smoke test com porta dinâmica (caminho real do usuário)
        shell: pwsh
        run: |
          # Sem RECEITA_FIXED_PORT: é assim que o aplicativo roda na máquina de destino.
          $env:RECEITA_NO_BROWSER = "1"
          Remove-Item Env:RECEITA_FIXED_PORT -ErrorAction SilentlyContinue
          $data = Join-Path $env:LOCALAPPDATA "ReceitasProcesso"
          Remove-Item (Join-Path $data "application.lock") -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist/ReceitaLocal/ReceitaLocal.exe" -PassThru
          try {
            $address = Join-Path $data "ENDERECO_DO_APLICATIVO.txt"
            $url = $null
            1..90 | ForEach-Object {
              if (-not $url -and (Test-Path $address)) { $url = (Get-Content $address -First 1).Trim() }
              if (-not $url) { Start-Sleep -Seconds 1 }
            }
            if (-not $url) { throw "O aplicativo não publicou o endereço em ENDERECO_DO_APLICATIVO.txt" }
            Write-Host "Endereço publicado: $url"
            if ($url -notmatch '^http://127\.0\.0\.1:\d+$') { throw "Endereço fora de 127.0.0.1: $url" }
            $port = [int]($url -split ':')[2]
            if ($port -lt 1024) { throw "Porta privilegiada inesperada: $port" }
            $ok = $false
            1..60 | ForEach-Object {
              if (-not $ok) {
                try {
                  if ((Invoke-WebRequest "$url/_stcore/health" -UseBasicParsing -TimeoutSec 1).StatusCode -eq 200) { $ok = $true }
                } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ok) { throw "A porta dinâmica $port não respondeu" }
            Write-Host "Porta dinâmica $port respondeu em /_stcore/health"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process ReceitaLocal -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Criar ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/ReceitaLocal -DestinationPath dist/ReceitaLocal-0.1.0-win-x64.zip -Force
      - name: Publicar aplicativo para download
        uses: actions/upload-artifact@v4
        with:
          name: ReceitaLocal-Windows-x64
          path: dist/ReceitaLocal-0.1.0-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Instruções no resumo da execução
        shell: pwsh
        run: |
          @"
          ## Aplicativo pronto para baixar

          1. Abra **Artifacts** nesta execução e baixe **ReceitaLocal-Windows-x64**.
          2. **Antes de extrair**, clique com o botão direito no ZIP baixado -> **Propriedades** ->
             marque **Desbloquear** -> **OK**. Isso remove a marca de "baixado da internet" de todo o
             conteúdo de uma vez e evita o aviso do SmartScreen na primeira execução.
          3. Extraia tudo para uma pasta local gravável e execute ``ReceitaLocal.exe``.
             O aplicativo é portátil: não instala nada e não pede administrador.

          Se ainda aparecer **"O Windows protegeu o computador"**, é apenas o aviso de reputação do
          SmartScreen: **Mais informações** -> **Executar assim mesmo**. Se em vez disso a mensagem
          disser que o aplicativo foi **bloqueado pelo administrador do sistema**, aí é política
          corporativa (AppLocker/WDAC) e o caminho é falar com a TI.

          O executável abre a aplicação no navegador em ``http://127.0.0.1:<porta>``. Essa URL é local
          ao computador e mantém os arquivos industriais fora da internet.

          O histórico de análises fica em ``%LOCALAPPDATA%\ReceitasProcesso`` e sobrevive à troca de versão.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
