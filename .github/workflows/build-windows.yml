name: Validar e empacotar para Windows

on:
  workflow_dispatch:
  push:
    branches: [release, main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes
        run: python -m pytest -q
      - name: Instalar navegador para a verificação de interface
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verificar a interface em um navegador real
        run: |
          set -euo pipefail
          export RECEITA_NO_BROWSER=1 PYTHONPATH=src
          export XDG_DATA_HOME="$RUNNER_TEMP/dados"
          python src/receita_local/launcher/main.py &
          endereco="$XDG_DATA_HOME/ReceitasProcesso/ENDERECO_DO_APLICATIVO.txt"
          for _ in $(seq 1 90); do [ -f "$endereco" ] && break || sleep 1; done
          test -f "$endereco" || { echo "a aplicação não publicou o endereço"; exit 1; }
          python tools/verificar_interface.py --url "$(head -1 "$endereco")"
          touch "$XDG_DATA_HOME/ReceitasProcesso/stop.request"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-falha-linux
          path: capturas-verificacao/
          if-no-files-found: ignore

  windows:
    name: Aplicativo Windows x64
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write        # necessário apenas para publicar a release em main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-dev.txt
      - name: Criar aplicativo onedir
        run: pyinstaller --noconfirm --clean ReceitaLocal.spec
      - name: Adicionar documentação e versão
        shell: pwsh
        run: |
          Copy-Item docs/GUIA_WINDOWS.md dist/ReceitaLocal/LEIA-ME.txt
          "0.1.0+$env:GITHUB_SHA" | Set-Content dist/ReceitaLocal/VERSAO.txt
      - name: Smoke test do executável e URL local
        shell: pwsh
        run: |
          $env:RECEITA_NO_BROWSER = "1"
          $env:RECEITA_FIXED_PORT = "8501"   # porta explícita, caminho de configuração
          $process = Start-Process -FilePath "dist/ReceitaLocal/ReceitaLocal.exe" -PassThru
          try {
            $ready = $false
            1..90 | ForEach-Object {
              if (-not $ready) {
                try {
                  $response = Invoke-WebRequest "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 1
                  if ($response.StatusCode -eq 200) { $ready = $true }
                } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ready) { throw "A URL local não ficou disponível" }
            # /_stcore/health responde mesmo se os estáticos do Streamlit faltarem no pacote.
            $page = Invoke-WebRequest "http://127.0.0.1:8501/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200) { throw "A página inicial devolveu $($page.StatusCode), não 200" }
            if ($page.Content -notmatch "(?i)streamlit") { throw "A página inicial não contém a aplicação" }
            Write-Host "Página inicial servida com $($page.Content.Length) bytes"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process ReceitaLocal -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Smoke test com porta dinâmica (caminho real do usuário)
        shell: pwsh
        run: |
          # Sem RECEITA_FIXED_PORT: é assim que o aplicativo roda na máquina de destino.
          $env:RECEITA_NO_BROWSER = "1"
          Remove-Item Env:RECEITA_FIXED_PORT -ErrorAction SilentlyContinue
          # Ocupa a porta preferida para forçar o caminho de fallback.
          $bloqueio = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8531)
          $bloqueio.Start()
          $data = Join-Path $env:LOCALAPPDATA "ReceitasProcesso"
          # O teste anterior encerra com Stop-Process -Force, que pula a limpeza do
          # launcher e deixa lock e endereço para trás. Sem isto o teste leria a porta antiga.
          Remove-Item (Join-Path $data "application.lock") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "ENDERECO_DO_APLICATIVO.txt") -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist/ReceitaLocal/ReceitaLocal.exe" -PassThru
          try {
            $address = Join-Path $data "ENDERECO_DO_APLICATIVO.txt"
            $url = $null
            1..90 | ForEach-Object {
              if (-not $url -and (Test-Path $address)) { $url = (Get-Content $address -First 1).Trim() }
              if (-not $url) { Start-Sleep -Seconds 1 }
            }
            if (-not $url) { throw "O aplicativo não publicou o endereço em ENDERECO_DO_APLICATIVO.txt" }
            Write-Host "Endereço publicado: $url"
            if ($url -notmatch '^http://127\.0\.0\.1:\d+$') { throw "Endereço fora de 127.0.0.1: $url" }
            $port = [int]($url -split ':')[2]
            if ($port -lt 1024) { throw "Porta privilegiada inesperada: $port" }
            if ($port -eq 8531) { throw "A porta preferida estava ocupada; o fallback não foi usado" }
            $ok = $false
            1..60 | ForEach-Object {
              if (-not $ok) {
                try {
                  if ((Invoke-WebRequest "$url/_stcore/health" -UseBasicParsing -TimeoutSec 1).StatusCode -eq 200) { $ok = $true }
                } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ok) { throw "A porta dinâmica $port não respondeu" }
            $page = Invoke-WebRequest "$url/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200) { throw "A página inicial devolveu $($page.StatusCode), não 200" }
            if ($page.Content -notmatch "(?i)streamlit") { throw "A página inicial não contém a aplicação" }
            Write-Host "Porta dinâmica $port serviu a página inicial com $($page.Content.Length) bytes"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process ReceitaLocal -ErrorAction SilentlyContinue | Stop-Process -Force
            $bloqueio.Stop()
          }

      - name: Verificar a interface do executável em um navegador real
        shell: pwsh
        run: |
          # O smoke test acima prova que o servidor responde. Este prova que a
          # aplicação carrega, o motor roda e a receita aparece na tela.
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          $env:RECEITA_NO_BROWSER = "1"
          Remove-Item Env:RECEITA_FIXED_PORT -ErrorAction SilentlyContinue
          $data = Join-Path $env:LOCALAPPDATA "ReceitasProcesso"
          Remove-Item (Join-Path $data "application.lock") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "ENDERECO_DO_APLICATIVO.txt") -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist/ReceitaLocal/ReceitaLocal.exe" -PassThru
          try {
            $endereco = Join-Path $data "ENDERECO_DO_APLICATIVO.txt"
            $url = $null
            1..90 | ForEach-Object {
              if (-not $url -and (Test-Path $endereco)) { $url = (Get-Content $endereco -First 1).Trim() }
              if (-not $url) { Start-Sleep -Seconds 1 }
            }
            if (-not $url) { throw "O executável não publicou o endereço" }
            python tools/verificar_interface.py --url $url
            if ($LASTEXITCODE -ne 0) { throw "A interface do executável não passou na verificação" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process ReceitaLocal -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-falha-windows
          path: capturas-verificacao/
          if-no-files-found: ignore

      - name: Diagnóstico quando o smoke test falha
        if: failure()
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA "ReceitasProcesso"
          Write-Host "=== conteúdo de $data ==="
          Get-ChildItem $data -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          foreach ($nome in @("logs\launcher.log", "logs\streamlit.log", "ENDERECO_DO_APLICATIVO.txt", "application.lock")) {
            $arquivo = Join-Path $data $nome
            if (Test-Path $arquivo) {
              Write-Host "=== $nome ==="
              Get-Content $arquivo -Tail 60
            }
          }
          Write-Host "=== estáticos do Streamlit empacotados ==="
          $static = "dist/ReceitaLocal/_internal/streamlit/static"
          if (Test-Path $static) { (Get-ChildItem $static -Recurse -File).Count } else { Write-Host "AUSENTE: $static" }

      - name: Publicar aplicativo para download
        id: publicar
        uses: actions/upload-artifact@v4
        with:
          name: ReceitaLocal-Windows-x64
          # A pasta, não um ZIP: o GitHub já compacta o artefato no download e
          # subir um ZIP aqui produziria um ZIP dentro de outro ZIP.
          path: dist/ReceitaLocal/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Publicar release com link permanente
        if: github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release recebe um ZIP de verdade: diferente do artefato, o GitHub
          # não recompacta o anexo, então não há ZIP dentro de ZIP.
          $versao = "v0.1.${{ github.run_number }}"
          Compress-Archive -Path dist/ReceitaLocal/* -DestinationPath ReceitaLocal-win-x64.zip -Force
          $notas = @"
          Aplicativo pronto para uso em Windows 10/11 x64. Não instala nada e não pede administrador.

          1. Baixe ``ReceitaLocal-win-x64.zip`` abaixo.
          2. **Antes de extrair**: botão direito no ZIP -> Propriedades -> marque **Desbloquear** -> OK.
          3. Extraia e abra ``ReceitaLocal.exe``. O navegador abre sozinho em ``http://127.0.0.1:8531``.

          O histórico de análises fica em ``%LOCALAPPDATA%\ReceitasProcesso`` e sobrevive à troca de versão.
          Todo o processamento é local: nenhum arquivo sai do computador.
          "@
          gh release create $versao ReceitaLocal-win-x64.zip --title "Receita Local $versao" --notes $notas --latest
          $permanente = "https://github.com/${{ github.repository }}/releases/latest/download/ReceitaLocal-win-x64.zip"
          @"
          ## Link permanente (sempre a versão mais recente)

          ### [>> Baixar ReceitaLocal <<]($permanente)

          Guarde este link nos favoritos: ele não expira e sempre aponta para a versão mais nova.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Instruções no resumo da execução
        shell: pwsh
        run: |
          @"
          ## Aplicativo pronto para baixar

          ### [>> Baixar ReceitaLocal-Windows-x64 <<](${{ steps.publicar.outputs.artifact-url }})

          1. Clique no link acima. (Ele também está em **Artifacts**, no fim desta página.)
          2. **Antes de extrair**, clique com o botão direito no ZIP baixado -> **Propriedades** ->
             marque **Desbloquear** -> **OK**. Isso remove a marca de "baixado da internet" de todo o
             conteúdo de uma vez e evita o aviso do SmartScreen na primeira execução.
          3. Extraia tudo para uma pasta local gravável e execute ``ReceitaLocal.exe``.
             O aplicativo é portátil: não instala nada e não pede administrador.

          Se ainda aparecer **"O Windows protegeu o computador"**, é apenas o aviso de reputação do
          SmartScreen: **Mais informações** -> **Executar assim mesmo**. Se em vez disso a mensagem
          disser que o aplicativo foi **bloqueado pelo administrador do sistema**, aí é política
          corporativa (AppLocker/WDAC) e o caminho é falar com a TI.

          O executável abre a aplicação sozinho no navegador, normalmente em ``http://127.0.0.1:8531``.
          Se essa porta estiver ocupada ele escolhe outra e grava o endereço em
          ``%LOCALAPPDATA%\ReceitasProcesso\ENDERECO_DO_APLICATIVO.txt``. Essa URL é local ao
          computador e mantém os arquivos industriais fora da internet.

          O histórico de análises fica em ``%LOCALAPPDATA%\ReceitasProcesso`` e sobrevive à troca de versão.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
