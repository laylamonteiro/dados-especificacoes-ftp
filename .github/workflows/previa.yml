name: Conferir a prévia da interface

# O GitHub Pages está configurado para publicar a partir do branch, então as
# capturas versionadas em docs/ é que vão ao ar. Este workflow não publica: ele
# regenera a prévia e confirma que continua correta e sem dado real.

on:
  workflow_dispatch:
  push:
    branches: [release, main, 'claude/**']
    paths:
      - 'src/receita_local/ui/**'
      - 'tools/gerar_previa.py'
      - '.github/workflows/previa.yml'

permissions:
  contents: read

jobs:
  conferir:
    name: Regenerar e conferir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências fixadas
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Regenerar a prévia
        run: python tools/gerar_previa.py --destino site --versao "${GITHUB_SHA::7}"
      - name: Conferir que só há dados sintéticos
        run: |
          test -f site/index.html
          test "$(ls site/telas/*.png | wc -l)" -eq 7
          ! grep -rilE "KSEA8BR45|KSEI8BR45|Gama|Jacarei|Jacareí" site/ || {
            echo "Identificador real encontrado na prévia"; exit 1; }
          echo "Prévia regenerada com 7 telas e sem identificador real."
      - name: Avisar se as capturas publicadas estão desatualizadas
        run: |
          if ! diff -q <(ls site/telas) <(ls docs/telas) >/dev/null; then
            echo "::warning::As capturas em docs/telas/ divergem da prévia regenerada."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: previa-regenerada
          path: site/
